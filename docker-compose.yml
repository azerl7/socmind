services:
  flask:
    build: .
    container_name: socmind-flask
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      DATABASE_URL: "sqlite:////app/data/socmind.db"
      SECRET_KEY: "socmind-docker-secret-key-change-in-production"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: "gpt-4o-mini"
    volumes:
      - ./uploads:/app/uploads
      - ./demo_data:/app/demo_data
      - socmind_data:/app/data
    command: >
      sh -c "
        echo '初始化数据库...' &&
        python scripts/init_db.py &&
        echo '生成演示日志...' &&
        python scripts/generate_demo_logs.py 2>/dev/null || true &&
        echo '启动服务...' &&
        gunicorn --bind 0.0.0.0:5000 --workers 2 --access-logfile - --error-logfile - wsgi:app
      "
    restart: unless-stopped

volumes:
  socmind_data: