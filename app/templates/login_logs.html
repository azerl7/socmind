{% extends "base.html" %}
{% block title %}SOCMind - 登录日志{% endblock %}
{% block page_title %}登录日志{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">登录历史</div>
    <div class="card-body">
        <div class="filter-bar mb-2">
            <input type="text" class="form-control form-control-sm" id="filterUsername" placeholder="用户名">
            <select class="form-select form-select-sm" id="filterResult" onchange="loadLogs(1)">
                <option value="">全部结果</option>
                <option value="success">成功</option>
                <option value="fail">失败</option>
            </select>
            <button class="btn btn-sm btn-primary" onclick="loadLogs(1)"><i class="bi bi-search"></i> 搜索</button>
        </div>
        <div style="overflow-x:auto;">
            <table class="table table-hover">
                <thead><tr>
                    <th>用户名</th><th>IP</th><th>结果</th><th>原因</th><th>User-Agent</th><th>时间</th>
                </tr></thead>
                <tbody id="logTableBody"><tr><td colspan="6" class="text-center text-muted py-4">加载中...</td></tr></tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted" id="logCountInfo"></small>
            <div id="logPagination"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadLogs(page) {
    const username = document.getElementById('filterUsername').value;
    const result = document.getElementById('filterResult').value;
    const params = { page, page_size: 20 };
    if (username) params.username = username;
    if (result) params.result = result;

    const resp = await apiGet('/system/login-logs', params);
    const data = resp?.data || { items: [], total: 0 };
    const tbody = document.getElementById('logTableBody');

    if (data.items.length) {
        tbody.innerHTML = data.items.map(l => {
            // 解析 UA 串为浏览器名(完整 UA 放 title)
            const ua = l.user_agent || '';
            let uaShort = '-';
            let uaTitle = '';
            if (ua) {
                uaTitle = ua;
                if (/Edg\//.test(ua)) uaShort = 'Edge';
                else if (/Chrome\//.test(ua) && !/Chromium/.test(ua)) uaShort = 'Chrome';
                else if (/Firefox\//.test(ua)) uaShort = 'Firefox';
                else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) uaShort = 'Safari';
                else if (/curl\//.test(ua)) uaShort = 'curl';
                else if (/Postman/.test(ua)) uaShort = 'Postman';
                else if (/python-requests/.test(ua)) uaShort = 'python-requests';
                else if (/python/.test(ua)) uaShort = 'Python';
                else uaShort = ua.length > 20 ? ua.substring(0, 20) + '…' : ua;
            }
            // 失败原因:失败时高亮
            const reasonHtml = l.fail_reason
                ? `<span class="badge bg-danger bg-opacity-25 text-danger" title="${l.fail_reason}">
                    <i class="bi bi-exclamation-circle"></i> ${l.fail_reason}
                   </span>`
                : '<small class="text-muted">-</small>';
            return `<tr>
                <td><strong>${l.username}</strong></td>
                <td><code>${l.ip_address}</code></td>
                <td>${l.result === 'success' ? '<span class="badge bg-success">成功</span>' : '<span class="badge bg-danger">失败</span>'}</td>
                <td>${reasonHtml}</td>
                <td title="${uaTitle}"><span class="badge bg-light text-dark">${uaShort}</span></td>
                <td><small class="text-muted">${fmtTime(l.created_at)}</small></td>
            </tr>`;
        }).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">暂无登录记录</td></tr>';
    }

    document.getElementById('logCountInfo').textContent = `共 ${data.total} 条记录`;
    renderPagination(document.getElementById('logPagination'), page, 20, data.total, loadLogs);
}

loadLogs(1);
</script>
{% endblock %}
