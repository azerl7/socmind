{% extends "base.html" %}
{% block title %}SOCMind - 攻击链{% endblock %}
{% block page_title %}攻击链{% endblock %}

{% block content %}
<div class="card mb-3">
    <div class="card-header">生成攻击链</div>
    <div class="card-body">
        <form id="generateForm" class="row g-2 align-items-end">
            <div class="col-auto">
                <input type="text" class="form-control form-control-sm" id="chainSrcIP" placeholder="源 IP (选填)">
            </div>
            <div class="col-auto">
                <input type="text" class="form-control form-control-sm" id="chainAsset" placeholder="目标资产 (选填)">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-diagram-3"></i> 生成攻击链</button>
            </div>
        </form>
        <div id="generateResult" class="mt-2"></div>
    </div>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>攻击链列表</span>
        <button class="btn btn-sm btn-outline-info" onclick="exportChains()"><i class="bi bi-download"></i> 导出 CSV</button>
    </div>
    <div class="card-body p-0">
        <table class="table table-hover">
            <thead><tr>
                <th>编号</th><th>标题</th><th>源 IP</th><th>阶段数</th><th>可信度</th>
                <th>风险分</th><th>时间</th><th>操作</th>
            </tr></thead>
            <tbody id="chainTableBody"><tr><td colspan="8" class="text-center text-muted py-4">加载中...</td></tr></tbody>
        </table>
    </div>
    <div class="card-body pt-0">
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted" id="chainCountInfo"></small>
            <div id="chainPagination"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('generateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const srcIp = document.getElementById('chainSrcIP').value;
    const asset = document.getElementById('chainAsset').value;
    document.getElementById('generateResult').innerHTML = '<div class="loading"><div class="spinner"></div><p>生成中...</p></div>';
    const resp = await apiPost('/attack-chains/generate', { src_ip: srcIp, asset });
    const d = resp?.data;
    if (d && d.chain_id) {
        document.getElementById('generateResult').innerHTML = `<div class="alert alert-success py-2 mb-0">生成成功: ${d.chain_no}, ${d.stage_count} 阶段, 可信度 ${d.confidence}, 风险分 ${d.risk_score}</div>`;
        loadChains(1);
    } else {
        document.getElementById('generateResult').innerHTML = `<div class="alert alert-warning py-2 mb-0">${resp?.message || '生成失败'}</div>`;
    }
});

async function loadChains(page) {
    const resp = await apiGet('/attack-chains', { page, page_size: 20 });
    const data = resp?.data || { items: [], total: 0 };
    const tbody = document.getElementById('chainTableBody');

    if (data.items.length) {
        tbody.innerHTML = data.items.map(c => `<tr>
            <td><small class="text-muted">${c.chain_no || '-'}</small></td>
            <td><a href="/chains/${c.id}" class="text-decoration-none fw-medium">${c.title}</a></td>
            <td><code>${c.src_ip || '-'}</code></td>
            <td><span class="badge bg-info">${c.stage_count} 阶段</span></td>
            <td>${severityBadge(c.confidence)}</td>
            <td><strong>${c.risk_score}</strong></td>
            <td><small class="text-muted">${fmtTime(c.created_at)}</small></td>
            <td><a href="/chains/${c.id}" class="btn btn-sm btn-outline-primary">详情</a></td>
        </tr>`).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">暂无攻击链数据</td></tr>';
    }

    document.getElementById('chainCountInfo').textContent = `共 ${data.total} 条记录`;
    renderPagination(document.getElementById('chainPagination'), page, 20, data.total, loadChains);
}

function exportChains() {
    window.open('/api/v1/export/chains/csv', '_blank');
}

loadChains(1);
</script>
{% endblock %}
