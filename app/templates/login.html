<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SOCMind - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: linear-gradient(135deg, #1a1f36 0%, #2d3352 100%); }
        .login-card { width: 400px; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-brand { text-align: center; margin-bottom: 32px; }
        .login-brand .brand-icon { width: 56px; height: 56px; border-radius: 12px; background: #3a7bf7; color: #fff; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
        .login-brand h2 { color: #1a1f36; font-weight: 700; font-size: 22px; margin-bottom: 4px; }
        .login-brand p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">S</div>
            <h2>SOCMind</h2>
            <p>AI 安全运营研判平台</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="请输入用户名" value="admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="请输入密码" value="admin123" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">登 录</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">默认账号: admin / admin123</small>
        </div>
    </div>
</body>
</html>
