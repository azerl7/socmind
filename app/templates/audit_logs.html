{% extends "base.html" %}
{% block title %}SOCMind - 审计日志{% endblock %}
{% block page_title %}审计日志{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">操作审计记录</div>
    <div class="card-body">
        <div class="filter-bar">
            <input type="text" class="form-control form-control-sm" id="filterAction" placeholder="操作类型" onchange="loadLogs(1)">
            <button class="btn btn-sm btn-primary" onclick="loadLogs(1)"><i class="bi bi-search"></i> 搜索</button>
        </div>
        <div style="overflow-x:auto;">
            <table class="table table-hover">
                <thead><tr>
                    <th>ID</th><th>用户</th><th>操作</th><th>对象类型</th><th>对象 ID</th><th>详情</th><th>IP</th><th>时间</th>
                </tr></thead>
                <tbody id="auditTableBody"><tr><td colspan="8" class="text-center text-muted py-4">加载中...</td></tr></tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted" id="auditCountInfo"></small>
            <div id="auditPagination"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadLogs(page) {
    const action = document.getElementById('filterAction').value;
    const params = { page, page_size: 20 };
    if (action) params.action = action;

    const resp = await apiGet('/system/audit-logs', params);
    const data = resp?.data || { items: [], total: 0 };
    const tbody = document.getElementById('auditTableBody');

    if (data.items.length) {
        tbody.innerHTML = data.items.map(l => `<tr>
            <td><small>${l.id}</small></td>
            <td>${l.username || '-'}</td>
            <td><span class="badge bg-info">${l.action}</span></td>
            <td>${l.target_type || '-'}</td>
            <td>${l.target_id || '-'}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.detail ? JSON.stringify(l.detail) : '-'}</td>
            <td><code>${l.ip_address || '-'}</code></td>
            <td><small class="text-muted">${fmtTime(l.created_at)}</small></td>
        </tr>`).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">暂无审计日志</td></tr>';
    }

    document.getElementById('auditCountInfo').textContent = `共 ${data.total} 条记录`;
    renderPagination(document.getElementById('auditPagination'), page, 20, data.total, loadLogs);
}

loadLogs(1);
</script>
{% endblock %}
