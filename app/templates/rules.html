{% extends "base.html" %}
{% block title %}SOCMind - 规则管理{% endblock %}
{% block page_title %}规则管理{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <span>检测规则</span>
        <div>
            <div class="btn-group me-1">
                <button class="btn btn-sm btn-outline-info dropdown-toggle" data-bs-toggle="dropdown">导入/导出</button>
                <ul class="dropdown-menu">
                    <li> <a class="dropdown-item" href="javascript:void(0)" onclick="exportRules()">导出全部 (JSON)</a></li>
                    <li> <a class="dropdown-item" href="javascript:void(0)" onclick="document.getElementById('importFileInput').click()">导入 (JSON)</a></li>
                </ul>
            </div>
            <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importRules(this)">
            <button class="btn btn-sm btn-primary" onclick="runAllRules()"><i class="bi bi-play-fill"></i> 执行检测</button>
        </div>
    </div>
    <div class="card-body">
        <div class="filter-bar">
            <select class="form-select form-select-sm" id="filterCategory" onchange="loadRules()">
                <option value="">全部分类</option>
                <option value="web">Web 攻击</option>
                <option value="account">账号安全</option>
                <option value="host">主机安全</option>
                <option value="network">网络安全</option>
            </select>
            <select class="form-select form-select-sm" id="filterEnabled" onchange="loadRules()">
                <option value="">全部状态</option>
                <option value="1">已启用</option>
                <option value="0">已禁用</option>
            </select>
        </div>
        <div style="overflow-x:auto;">
            <table class="table table-hover">
                <thead><tr>
                    <th>规则编码</th><th>名称</th><th>分类</th><th>攻击类型</th>
                    <th>等级</th><th>阶段</th><th>状态</th><th>操作</th>
                </tr></thead>
                <tbody id="ruleTableBody"><tr><td colspan="8" class="text-center text-muted py-4">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">执行规则检测</div>
    <div class="card-body">
        <form id="runRuleForm" class="row g-2 align-items-end">
            <div class="col-auto">
                <select class="form-select form-select-sm" id="runLogType">
                    <option value="">全部日志类型</option>
                    <option value="web">Web</option>
                    <option value="login">登录</option>
                    <option value="waf">WAF</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-play-fill"></i> 执行检测</button>
            </div>
        </form>
        <div id="runResult" class="mt-2"></div>
    </div>
</div>

<div class="card">
    <div class="card-header">规则测试工具 (R-11)</div>
    <div class="card-body">
        <form id="testRuleForm" class="row g-2 align-items-end">
            <div class="col-12">
                <textarea class="form-control form-control-sm" id="testSample" rows="3" placeholder="输入测试样本（URL、参数、请求内容等）..."></textarea>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-search"></i> 测试匹配</button>
            </div>
            <div class="col-auto">
                <small class="text-muted">将用所有已启用的正则规则测试该样本</small>
            </div>
        </form>
        <div id="testResult" class="mt-2"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadRules() {
    const category = document.getElementById('filterCategory').value;
    const enabled = document.getElementById('filterEnabled').value;
    const params = { page_size: 100 };
    if (category) params.category = category;
    if (enabled) params.enabled = enabled;

    const resp = await apiGet('/rules', params);
    const items = resp?.data?.items || [];
    const tbody = document.getElementById('ruleTableBody');

    if (items.length) {
        tbody.innerHTML = items.map(r => `<tr>
            <td><code>${r.rule_code}</code></td>
            <td>${r.rule_name}</td>
            <td><span class="badge bg-secondary">${r.category}</span></td>
            <td>${r.attack_type}</td>
            <td>${severityBadge(r.severity)}</td>
            <td><small>${r.stage_code || '-'}</small></td>
            <td>${r.enabled ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>'}</td>
            <td>
                <button class="btn btn-sm ${r.enabled ? 'btn-outline-warning' : 'btn-outline-success'}"
                    onclick="toggleRule(${r.id})">${r.enabled ? '禁用' : '启用'}</button>
            </td>
        </tr>`).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">暂无规则</td></tr>';
    }
}

async function toggleRule(id) {
    const resp = await apiPost(`/rules/${id}/toggle`);
    if (resp.code === 0) { showToast('规则状态已更新'); loadRules(); }
    else showToast(resp.message, 'error');
}

async function runAllRules() {
    const resp = await apiPost('/rules/run', {});
    if (resp.code === 0) {
        const d = resp.data;
        showToast(`检测完成: 扫描 ${d.checked_count} 条日志, 生成 ${d.alert_count} 条告警`);
    } else {
        showToast(resp.message, 'error');
    }
}

// R-11: 规则测试工具
async function testRules() {
    const sample = document.getElementById('testSample').value.trim();
    if (!sample) { showToast('请输入测试样本', 'warning'); return; }

    const resp = await apiPost('/rules/test', { sample });
    const r = resp?.data || {};
    const results = r.results || [];
    const el = document.getElementById('testResult');

    if (results.length === 0) {
        el.innerHTML = '<div class="alert alert-info py-2 mb-0"><small>没有规则匹配该样本</small></div>';
        return;
    }

    const matched = results.filter(x => x.matched === true);
    const unmatched = results.filter(x => x.matched === false && !x.error);
    const statOnly = results.filter(x => x.matched === null);
    const errors = results.filter(x => x.error);

    let html = `<div class="mb-1"><small class="text-muted">测试 ${r.tested_rules || 0} 条规则，命中 ${matched.length} 条</small></div>`;

    if (matched.length) {
        html += '<table class="table table-sm table-bordered mb-2"><thead><tr><th>规则</th><th>攻击类型</th><th>等级</th><th>匹配内容</th></tr></thead><tbody>';
        matched.forEach(m => {
            html += `<tr><td><code>${m.rule_code}</code></td><td>${m.attack_type}</td><td>${severityBadge(m.severity)}</td><td><code style="font-size:12px;">${m.match_preview || ''}</code></td></tr>`;
        });
        html += '</tbody></table>';
    }

    if (errors.length) {
        html += errors.map(e => `<div class="alert alert-danger py-1 mb-1"><small>${e.rule_code}: ${e.error}</small></div>`).join('');
    }

    if (statOnly.length) {
        html += `<div class="alert alert-info py-1 mb-0"><small>${statOnly.length} 条统计类规则需在真实日志上执行检测</small></div>`;
    }

    el.innerHTML = html;
}

document.getElementById('testRuleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    testRules();
});

document.getElementById('runRuleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const logType = document.getElementById('runLogType').value;
    const params = {};
    if (logType) params.log_type = logType;
    const resp = await apiPost('/rules/run', params);
    const d = resp?.data || {};
    document.getElementById('runResult').innerHTML = resp.code === 0
        ? `<div class="alert alert-success py-2 mb-0"><small>检测完成: 扫描 ${d.checked_count} 条日志, 生成 ${d.alert_count} 条告警</small></div>`
        : `<div class="alert alert-danger py-2 mb-0"><small>${resp.message}</small></div>`;
});

async function exportRules() {
    const resp = await fetch('/api/v1/rules/export');
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'socmind_rules.json';
    a.click();
}

async function importRules(input) {
    const file = input.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    const resp = await apiUpload('/rules/import', formData);
    if (resp.code === 0) showToast(`导入成功: ${resp.data.imported} 条`);
    else showToast(resp.message, 'error');
    loadRules();
}

loadRules();
</script>
{% endblock %}
